    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080b12;
            color: #f4f7ff;
            font-family: Arial, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            margin: 18px 5% 0;
            min-height: 76px;
            padding: 0 30px;

            background: #0c111b;

            color: #f4f7ff;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        nav a {
            color: #b9c5d8;
            font-size: 14px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #58b1ff;
        }

        .page-heading {
            max-width: 1150px;
            margin: auto;
            padding: 75px 0 30px;
        }

        .page-heading span {
            color: #58b1ff;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .page-heading h1 {
            font-size: 38px;
            margin: 12px 0;
        }

        .page-heading p {
            color: #929eb2;
            font-size: 15px;
        }

        footer {
            border-top: 1px solid #1c2839;
            padding: 25px;
            text-align: center;
            color: #68768c;
            font-size: 13px;
            margin-top: 90px;
        }

        @media (max-width: 900px) {
            .page-heading {
                padding-left: 5%;
                padding-right: 5%;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
                flex-direction: column;
                gap: 18px;
                border-radius: 20px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 16px;
            }

            .page-heading h1 {
                font-size: 30px;
            }
        }
